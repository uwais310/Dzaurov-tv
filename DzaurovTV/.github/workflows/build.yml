name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk DzaurovTV-debug.apk

      # If the build fails, the run's Summary page shows only the real errors,
      # short enough to copy on a phone or iPad and paste back to Claude.
      - name: Short error report
        if: failure()
        run: |
          {
            echo "## Build failed: copy everything in the box below and send it to Claude"
            echo '```'
            grep -E "^e: |error:|What went wrong|Unresolved reference|Execution failed|Could not resolve" build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: DzaurovTV-debug
          path: DzaurovTV-debug.apk

      # Gives a stable download link for the Downloader app:
      # https://github.com/<you>/<repo>/releases/latest/download/DzaurovTV-debug.apk
      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dzaurov TV build ${{ github.run_number }}
          files: DzaurovTV-debug.apk
          make_latest: true
